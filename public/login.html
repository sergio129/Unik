<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La UNIKa - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/login.css">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <img src="images/logo.png" alt="La UNIKA Logo" onerror="this.src='https://via.placeholder.com/150?text=UNIKA'">
            </div>
            <h1>Sistema La UNIKA</h1>
            <p>Gestión de Negocio</p>
        </div>
        
        <div class="login-form">
            <div id="error-message" class="error-message" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text">Usuario o contraseña incorrectos</span>
            </div>
            
            <div id="success-message" class="success-message" style="display: none;">
                <i class="fas fa-check-circle"></i>
                <span id="success-text">Inicio de sesión exitoso</span>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-group">
                        <input type="text" id="username" name="username" class="form-control" placeholder="Ingrese su usuario" autocomplete="username" required>
                        <i class="fas fa-user"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-group">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Ingrese su contraseña" autocomplete="current-password" required>
                        <i id="togglePassword" class="fas fa-eye-slash toggle-password"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="role">Ingresar como</label>
                    <div class="input-group role-group">
                        <select id="role" name="role" class="form-control">
                            <option value="vendedor">Asesor / Vendedor</option>
                            <option value="admin">Administrador</option>
                            <option value="inventario">Inventario</option>
                        </select>
                        <i class="fas fa-user-tag"></i>
                    </div>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Recordar sesión</label>
                    </div>
                    <div class="forgot-password">
                        <a href="#" id="forgotPassword">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>
            
            <div class="form-footer">
                <p>&copy; 2025 La UNIKA - Todos los derechos reservados</p>
            </div>
        </div>
    </div>

    <!-- Modal para recuperación de contraseña -->
    <div id="passwordResetModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Recuperar Contraseña</h2>
            <p>Ingresa tu correo electrónico para recibir instrucciones de recuperación.</p>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="resetEmail">Correo Electrónico</label>
                    <div class="input-group">
                        <input type="email" id="resetEmail" name="resetEmail" class="form-control" placeholder="Ingrese su correo" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>
                <button type="submit" class="reset-btn">
                    <i class="fas fa-paper-plane"></i> Enviar Instrucciones
                </button>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
