<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Clientes | La UNIKA</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.5/dist/sweetalert2.min.css">
  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/components/notifications.css">
  <link rel="stylesheet" href="/css/ventas.css">
</head>
<body>
  <div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-light border-right" id="sidebar-wrapper">
      <div class="sidebar-heading">La UNIKA</div>
      <div class="list-group list-group-flush">
        <a href="/dashboard" class="list-group-item list-group-item-action bg-light">
          <i class="fas fa-tachometer-alt me-2"></i> Dashboard
        </a>
        <a href="/inventario/productos" class="list-group-item list-group-item-action bg-light">
          <i class="fas fa-box me-2"></i> Productos
        </a>
        <a href="/inventario/categorias" class="list-group-item list-group-item-action bg-light">
          <i class="fas fa-folder me-2"></i> Categorías
        </a>
        <a href="/inventario/movimientos" class="list-group-item list-group-item-action bg-light">
          <i class="fas fa-exchange-alt me-2"></i> Movimientos
        </a>
        <a href="/ventas" class="list-group-item list-group-item-action bg-light">
          <i class="fas fa-cash-register me-2"></i> Ventas
        </a>
        <a href="#" class="list-group-item list-group-item-action bg-primary text-white">
          <i class="fas fa-users me-2"></i> Clientes
        </a>
        <a href="/ventas/historial" class="list-group-item list-group-item-action bg-light">
          <i class="fas fa-history me-2"></i> Historial de Ventas
        </a>
        <div id="adminSection" style="display:none;">
          <a href="/admin/usuarios" class="list-group-item list-group-item-action bg-light">
            <i class="fas fa-users-cog me-2"></i> Gestión de Usuarios
          </a>
        </div>
        <a href="#" id="logout" class="list-group-item list-group-item-action bg-light text-danger">
          <i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión
        </a>
      </div>
    </div>
    <!-- /#sidebar-wrapper -->

    <!-- Page Content -->
    <div id="page-content-wrapper">
      <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <button class="btn btn-primary" id="menu-toggle">
          <i class="fas fa-bars"></i>
        </button>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                <i class="fas fa-user me-2"></i><span id="username">Usuario</span>
              </a>
              <div class="dropdown-menu dropdown-menu-end">
                <a class="dropdown-item" href="#" id="profile">Perfil</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#" id="logout-dropdown">Cerrar sesión</a>
              </div>
            </li>
          </ul>
        </div>
      </nav>

      <div class="container-fluid mt-4">
        <h1 class="mt-2 mb-4">Gestión de Clientes</h1>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center">
              <button class="btn btn-primary btn-nuevo-cliente-mejorado" id="btn-nuevo-cliente">
                <span class="icon-wrapper"><i class="fas fa-user-plus"></i></span>
                <span class="btn-text">Nuevo Cliente</span>
                <span class="effect"></span>
              </button>
              <div class="ms-3">
                <select class="form-select" id="filtro-estado">
                  <option value="activos">Solo Activos</option>
                  <option value="inactivos">Solo Inactivos</option>
                  <option value="todos">Todos</option>
                </select>
              </div>
            </div>
            <div class="d-flex">
              <div class="input-group">
                <input type="text" class="form-control" placeholder="Buscar cliente..." id="busqueda-cliente">
                <button class="btn btn-outline-secondary" type="button" id="btn-buscar-cliente">
                  <i class="fas fa-search"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-striped table-hover" id="tabla-clientes">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Nombre</th>
                      <th>Documento</th>
                      <th>Teléfono</th>
                      <th>Email</th>
                      <th>Estado</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Los datos se cargarán dinámicamente -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Nuevo/Editar Cliente -->
  <div class="modal fade" id="modalCliente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" style="max-width: 500px; margin-left: auto; margin-right: auto;">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalClienteTitulo">
            <i class="fas fa-user-plus me-2"></i>Nuevo Cliente
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-cliente">
            <input type="hidden" id="cliente-id">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3 input-group-custom">
                  <label for="cliente-nombre" class="form-label"><i class="fas fa-user me-2"></i>Nombre completo *</label>
                  <input type="text" class="form-control" id="cliente-nombre" required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3 input-group-custom">
                  <label for="cliente-tipo-documento" class="form-label"><i class="fas fa-id-card me-2"></i>Tipo de documento</label>
                  <select class="form-select" id="cliente-tipo-documento">
                    <option value="CC">CC - Cédula de Ciudadanía</option>
                    <option value="CE">CE - Cédula de Extranjería</option>
                    <option value="NIT">NIT - Número de Identificación Tributaria</option>
                    <option value="TI">TI - Tarjeta de Identidad</option>
                    <option value="PP">PP - Pasaporte</option>
                  </select>
                </div>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3 input-group-custom">
                  <label for="cliente-documento" class="form-label"><i class="fas fa-fingerprint me-2"></i>Número de documento</label>
                  <input type="text" class="form-control" id="cliente-documento">
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3 input-group-custom">
                  <label for="cliente-direccion" class="form-label"><i class="fas fa-map-marker-alt me-2"></i>Dirección</label>
                  <input type="text" class="form-control" id="cliente-direccion">
                </div>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3 input-group-custom">
                  <label for="cliente-telefono" class="form-label"><i class="fas fa-phone-alt me-2"></i>Teléfono</label>
                  <input type="text" class="form-control" id="cliente-telefono">
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3 input-group-custom">
                  <label for="cliente-email" class="form-label"><i class="fas fa-envelope me-2"></i>Email</label>
                  <input type="email" class="form-control" id="cliente-email">
                </div>
              </div>
            </div>
            
            <div class="mb-3 mt-2">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="cliente-activo" checked>
                <label class="form-check-label" for="cliente-activo">
                  <i class="fas fa-toggle-on me-2 text-success"></i>Cliente Activo
                </label>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="fas fa-times me-2"></i>Cancelar
          </button>
          <button type="button" class="btn btn-primary" id="btn-guardar-cliente">
            <i class="fas fa-save me-2"></i>Guardar Cliente
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.5/dist/sweetalert2.all.min.js"></script>
  <!-- DataTables -->
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <!-- Custom JS -->
  <script src="/js/ventas/clientes.js"></script>
  <script>
    // Toggle sidebar
    $("#menu-toggle").click(function(e) {
      e.preventDefault();
      $("#wrapper").toggleClass("toggled");
    });

    // Logout
    $("#logout, #logout-dropdown").click(function() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/login';
    });

    // Mostrar datos del usuario
    document.addEventListener('DOMContentLoaded', function() {
      const userData = JSON.parse(localStorage.getItem('user') || '{}');
      
      if (userData.username) {
        document.getElementById('username').textContent = userData.nombre_completo || userData.username;
        
        // Mostrar sección de admin solo si el rol es admin
        if (userData.rol === 'admin') {
          document.getElementById('adminSection').style.display = 'block';
        }
      }
    });
  </script>
</body>
</html>
